name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "v${PACKAGE_VERSION}" = "$GITHUB_REF_NAME"

      - name: Check format, lint, types, and localization
        env:
          EXPECTED_PUBLISHER: ${{ vars.VS_MARKETPLACE_PUBLISHER }}
          EXPECTED_VERSION: ${{ github.ref_name }}
          PUBLIC_RELEASE: "true"
        run: |
          pnpm run format
          pnpm run lint
          pnpm run typecheck
          pnpm run l10n:check
          pnpm run release:check

      - name: Run unit tests
        run: pnpm run test

      - name: Run extension-host tests
        run: xvfb-run -a pnpm run test:ext

  package:
    name: Package GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package VSIX
        run: |
          mkdir -p dist
          pnpm dlx @vscode/vsce package --no-dependencies --out "dist/zeeho-git-graph-${GITHUB_REF_NAME#v}.vsix"

      - name: Verify archive and create checksum
        run: |
          unzip -t "dist/zeeho-git-graph-${GITHUB_REF_NAME#v}.vsix"
          cd dist
          sha256sum "zeeho-git-graph-${GITHUB_REF_NAME#v}.vsix" > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: zeeho-git-graph-${{ github.ref_name }}
          path: |
            dist/*.vsix
            dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.vsix dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Zeeho Git Graph $GITHUB_REF_NAME"

  publish-marketplace:
    name: Publish to VS Marketplace
    if: ${{ vars.ENABLE_REGISTRY_PUBLISH == 'true' }}
    needs: package
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: pnpm/setup@v2
        with:
          runtime: node@24

      - uses: actions/download-artifact@v4
        with:
          name: zeeho-git-graph-${{ github.ref_name }}
          path: dist

      - name: Publish the verified VSIX
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: pnpm dlx @vscode/vsce publish --packagePath dist/*.vsix -p "$VS_MARKETPLACE_TOKEN"

  publish-open-vsx:
    name: Publish to Open VSX
    if: ${{ vars.ENABLE_REGISTRY_PUBLISH == 'true' }}
    needs: package
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: pnpm/setup@v2
        with:
          runtime: node@24

      - uses: actions/download-artifact@v4
        with:
          name: zeeho-git-graph-${{ github.ref_name }}
          path: dist

      - name: Publish the verified VSIX
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: pnpm dlx ovsx publish dist/*.vsix -p "$OPEN_VSX_TOKEN"
